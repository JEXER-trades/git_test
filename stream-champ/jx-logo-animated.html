<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>JX Gaming Logo</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  html.bg body { background: radial-gradient(circle at 50% 45%, #1a1f45 0%, #05060d 65%); }
  svg { display: block; width: 100vmin; height: 100vmin; margin: 0 auto; }
  * { transform-box: fill-box; }

  /* hexagon draws itself in */
  .hex-draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.1s cubic-bezier(.6,0,.3,1) both; }
  @keyframes draw { from { stroke-dashoffset: 1; } }

  /* blurred copy behind the frame breathes */
  .hex-aura { opacity: .9; animation: fadein .6s 1s both, breathe 2.4s 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }

  .inner { opacity: 1; animation: fadein .5s .6s both; }
  .ticks { opacity: 1; animation: fadein .4s 1.1s both; }
  @keyframes fadein { from { opacity: 0; } }

  /* JX slams in */
  .jx { transform-origin: center; animation: slam .55s .9s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes slam { from { opacity: 0; transform: scale(1.9); } 70% { opacity: 1; transform: scale(.94); } }

  /* white light sweep across the letters */
  .sweep { transform: translateX(-500px); animation: sweep 4.5s 2.2s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-500px); } 30%, 100% { transform: translateX(700px); } }

  /* JX outline flickers like neon now and then */
  .jx-neon { animation: flicker 6s 3s infinite; }
  @keyframes flicker { 0%, 90%, 93%, 96%, 100% { opacity: 1; } 91.5%, 94.5% { opacity: .25; } }

  /* GAMING banner */
  .banner { transform-origin: left center; animation: grow .45s 1.35s cubic-bezier(.3,0,.2,1) both; }
  @keyframes grow { from { transform: scaleX(0); } }
  .gaming { letter-spacing: 16px; animation: spread .6s 1.9s ease-out both; }
  @keyframes spread { from { letter-spacing: 46px; opacity: 0; } }
  .chev { animation: fadein .3s 1.8s both, nudge 1.6s 2.1s ease-in-out infinite; }
  .chev.r { animation-name: fadein, nudger; }
  @keyframes nudge { 50% { transform: translateX(-8px); } }
  @keyframes nudger { 50% { transform: translateX(8px); } }

  /* rising sparks */
  .spark { opacity: 0; animation: rise 3.2s linear infinite; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-170px); } }

  /* still frame for PNG export: everything at its resting state */
  html.still *, html.still *::before { animation: none !important; }
  html.still .sweep { opacity: 0; }
  html.still .spark, html.still .orbit { display: none; }
</style>
</head>
<body>
<svg id="logo" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#FF2E88"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="neonStatic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#FF2E88"/>
    </linearGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#9FF3FF"/>
      <stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="jxClip">
      <text x="388" y="466" text-anchor="middle" font-family="Segoe UI Black, Arial Black, Impact, sans-serif"
            font-weight="900" font-style="italic" font-size="250" letter-spacing="-12">JX</text>
    </clipPath>
    <path id="hexPath" d="M400,105 L640,243 L640,519 L400,657 L160,519 L160,243 Z"/>
  </defs>

  <!-- aura behind the frame -->
  <polygon class="hex-aura" points="400,105 640,243 640,519 400,657 160,519 160,243"
           fill="none" stroke="url(#neon)" stroke-width="30" filter="url(#blur)"/>

  <!-- inner plate -->
  <g class="inner">
    <polygon points="400,140 610,261 610,501 400,622 190,501 190,261"
             fill="#0a0d1f" fill-opacity="0.7" stroke="#7C4DFF" stroke-opacity="0.4" stroke-width="3"/>
    <polygon points="400,175 580,279 580,483 400,587 220,483 220,279"
             fill="none" stroke="#00E5FF" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 10"/>
  </g>

  <!-- main frame -->
  <polygon class="hex-draw" pathLength="1" points="400,105 640,243 640,519 400,657 160,519 160,243"
           fill="none" stroke="url(#neon)" stroke-width="16" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- vertex ticks -->
  <g class="ticks" fill="#fff" filter="url(#softglow)">
    <circle cx="400" cy="105" r="6"/>
    <circle cx="640" cy="243" r="5"/>
    <circle cx="160" cy="243" r="5"/>
    <circle cx="640" cy="519" r="5"/>
    <circle cx="160" cy="519" r="5"/>
  </g>

  <!-- light orbiting the frame -->
  <g class="orbit">
    <circle r="7" fill="#fff" filter="url(#softglow)">
      <animateMotion dur="5s" begin="1.2s" repeatCount="indefinite" rotate="auto"><mpath href="#hexPath"/></animateMotion>
    </circle>
    <circle r="5" fill="#FF2E88" filter="url(#softglow)">
      <animateMotion dur="5s" begin="3.7s" repeatCount="indefinite" rotate="auto"><mpath href="#hexPath"/></animateMotion>
    </circle>
  </g>

  <!-- sparks -->
  <g fill="#9FF3FF" filter="url(#softglow)">
    <circle class="spark" cx="250" cy="540" r="3" style="animation-delay:2.0s"/>
    <circle class="spark" cx="320" cy="560" r="2" style="animation-delay:2.8s; fill:#FF2E88"/>
    <circle class="spark" cx="470" cy="555" r="3" style="animation-delay:3.4s"/>
    <circle class="spark" cx="545" cy="540" r="2" style="animation-delay:2.4s; fill:#7C4DFF"/>
    <circle class="spark" cx="400" cy="570" r="2" style="animation-delay:4.1s"/>
    <circle class="spark" cx="290" cy="530" r="2" style="animation-delay:4.7s; fill:#7C4DFF"/>
  </g>

  <!-- JX monogram -->
  <g class="jx">
    <text x="400" y="478" text-anchor="middle" font-family="Segoe UI Black, Arial Black, Impact, sans-serif"
          font-weight="900" font-style="italic" font-size="250" letter-spacing="-12" fill="#000" fill-opacity="0.6">JX</text>
    <text x="388" y="466" text-anchor="middle" font-family="Segoe UI Black, Arial Black, Impact, sans-serif"
          font-weight="900" font-style="italic" font-size="250" letter-spacing="-12"
          fill="url(#letters)" filter="url(#softglow)">JX</text>
    <text class="jx-neon" x="388" y="466" text-anchor="middle" font-family="Segoe UI Black, Arial Black, Impact, sans-serif"
          font-weight="900" font-style="italic" font-size="250" letter-spacing="-12"
          fill="none" stroke="#FF2E88" stroke-width="3.5" filter="url(#softglow)">JX</text>
    <g clip-path="url(#jxClip)">
      <g transform="skewX(-20)"><rect class="sweep" x="0" y="250" width="110" height="260" fill="url(#sweepGrad)"/></g>
    </g>
  </g>

  <!-- GAMING banner -->
  <polygon class="banner" points="212,560 608,560 588,622 192,622" fill="url(#neonStatic)" filter="url(#softglow)"/>
  <polygon class="chev" points="178,575 160,591 178,607 170,591" fill="#00E5FF" filter="url(#softglow)"/>
  <polygon class="chev r" points="622,575 640,591 622,607 630,591" fill="#FF2E88" filter="url(#softglow)"/>
  <text class="gaming" x="408" y="607" text-anchor="middle" font-family="Segoe UI Black, Arial Black, Impact, sans-serif"
        font-weight="900" font-size="50" fill="#06070f">GAMING</text>
</svg>
<script>
  // #still -> resting frame for PNG export, #bg -> dark background; e.g. jx-logo-animated.html#still,bg
  var modes = location.hash.slice(1).split(',');
  modes.forEach(function (m) { if (m) document.documentElement.classList.add(m); });
  if (modes.indexOf('still') >= 0) {
    var svg = document.getElementById('logo');
    svg.pauseAnimations();
    svg.setCurrentTime(0);
  }
</script>
</body>
</html>
